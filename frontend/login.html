<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourcify — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .font-display { font-family: 'Fraunces', serif; }
  .font-body { font-family: 'IBM Plex Sans', sans-serif; }
  .font-mono-ibm { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body class="bg-[#0C0B0A] text-[#F3EFE7] font-body antialiased min-h-screen flex flex-col">

<header class="shrink-0">
  <div class="max-w-[1400px] mx-auto px-8 py-6">
    <a href="index.html" class="flex items-center gap-2 font-display text-[20px] font-semibold tracking-tight">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="8" r="4" fill="#E3A63C"/>
        <circle cx="7" cy="24" r="4" fill="#C1443A"/>
        <circle cx="24" cy="16" r="4.5" fill="#F3EFE7"/>
        <path d="M10.5 9.5L20 15" stroke="#A89C8C" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M10.5 22.5L20 17" stroke="#A89C8C" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span><span class="text-[#E3A63C]">Source</span><span class="text-[#C1443A]">ify</span></span>
    </a>
  </div>
</header>

<main class="flex-1 flex items-start justify-center px-6 pt-20 pb-16">
  <div class="w-full max-w-[400px]">

    <div class="text-center mb-8">
      <div class="font-mono-ibm text-xs tracking-[0.14em] uppercase text-[#E3A63C] mb-3">Welcome back</div>
      <h1 class="font-display text-[28px] font-semibold mb-2">Log in to Sourcify</h1>
      <p class="text-sm text-[#A89C8C]">Your sources and chat history pick up right where you left off.</p>
    </div>

    <form id="login-form" class="bg-[#1B1817] border border-[#2A2622] rounded-[18px] p-7 flex flex-col gap-4">

      <div id="form-error" class="hidden text-sm text-[#C1443A] bg-[#C1443A]/[0.1] border border-[#C1443A]/30 rounded-md px-3.5 py-2.5"></div>

      <label class="block">
        <span class="text-xs font-medium text-[#A89C8C] mb-1.5 block">Email</span>
        <input id="email" type="email" required placeholder="you@example.com"
          class="w-full bg-[#16110C] border border-[#332E28] rounded-md px-3.5 py-3 text-sm placeholder:text-[#4E463D] focus:outline-none focus:border-[#E3A63C] transition-colors">
      </label>

      <label class="block">
        <span class="text-xs font-medium text-[#A89C8C] mb-1.5 block">Password</span>
        <input id="password" type="password" required placeholder="Your password"
          class="w-full bg-[#16110C] border border-[#332E28] rounded-md px-3.5 py-3 text-sm placeholder:text-[#4E463D] focus:outline-none focus:border-[#E3A63C] transition-colors">
      </label>

      <button id="submit-btn" type="submit" class="mt-2 w-full text-[15px] font-semibold bg-gradient-to-br from-[#E3A63C] to-[#C1443A] text-[#16110C] px-6 py-3.5 rounded-md hover:-translate-y-0.5 hover:shadow-[0_8px_24px_rgba(227,166,60,0.18)] transition-all disabled:opacity-50 disabled:pointer-events-none">
        Log in
      </button>
    </form>

    <p class="text-center text-sm text-[#A89C8C] mt-6">
      Don't have an account? <a href="signup.html" class="text-[#E3A63C] hover:underline font-medium">Sign up</a>
    </p>
  </div>
</main>

<script src="js/login.js"></script>

</body>
</html>
