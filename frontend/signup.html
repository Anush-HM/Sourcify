<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnivex — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .font-display { font-family: 'Fraunces', serif; }
  .font-body { font-family: 'IBM Plex Sans', sans-serif; }
  .font-mono-ibm { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body class="bg-[#0C0B0A] text-[#F3EFE7] font-body antialiased min-h-screen flex flex-col">

<header class="shrink-0">
  <div class="max-w-[1400px] mx-auto px-8 py-6">
    <a href="index.html" class="font-display text-[20px] font-semibold tracking-tight">
      <span class="text-[#E3A63C]">Omni</span><span class="text-[#C1443A]">vex</span>
    </a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-6 pb-16">
  <div class="w-full max-w-[400px]">

    <div class="text-center mb-8">
      <div class="font-mono-ibm text-xs tracking-[0.14em] uppercase text-[#E3A63C] mb-3">Get started</div>
      <h1 class="font-display text-[28px] font-semibold mb-2">Create your account</h1>
      <p class="text-sm text-[#A89C8C]">Bring three sources, get one grounded answer.</p>
    </div>

    <form id="signup-form" class="bg-[#1B1817] border border-[#2A2622] rounded-[18px] p-7 flex flex-col gap-4">

      <div id="form-error" class="hidden text-sm text-[#C1443A] bg-[#C1443A]/[0.1] border border-[#C1443A]/30 rounded-md px-3.5 py-2.5"></div>

      <label class="block">
        <span class="text-xs font-medium text-[#A89C8C] mb-1.5 block">Full name</span>
        <input id="name" type="text" required placeholder="Ada Lovelace"
          class="w-full bg-[#16110C] border border-[#332E28] rounded-md px-3.5 py-3 text-sm placeholder:text-[#4E463D] focus:outline-none focus:border-[#E3A63C] transition-colors">
      </label>

      <label class="block">
        <span class="text-xs font-medium text-[#A89C8C] mb-1.5 block">Email</span>
        <input id="email" type="email" required placeholder="you@example.com"
          class="w-full bg-[#16110C] border border-[#332E28] rounded-md px-3.5 py-3 text-sm placeholder:text-[#4E463D] focus:outline-none focus:border-[#E3A63C] transition-colors">
      </label>

      <label class="block">
        <span class="text-xs font-medium text-[#A89C8C] mb-1.5 block">Password</span>
        <input id="password" type="password" required minlength="8" placeholder="At least 8 characters"
          class="w-full bg-[#16110C] border border-[#332E28] rounded-md px-3.5 py-3 text-sm placeholder:text-[#4E463D] focus:outline-none focus:border-[#E3A63C] transition-colors">
      </label>

      <button id="submit-btn" type="submit" class="mt-2 w-full text-[15px] font-semibold bg-gradient-to-br from-[#E3A63C] to-[#C1443A] text-[#16110C] px-6 py-3.5 rounded-md hover:-translate-y-0.5 hover:shadow-[0_8px_24px_rgba(227,166,60,0.18)] transition-all disabled:opacity-50 disabled:pointer-events-none">
        Create account
      </button>

      <div class="flex items-center gap-3 my-1">
        <div class="h-px flex-1 bg-[#2A2622]"></div>
        <span class="font-mono-ibm text-[11px] text-[#6E645A]">or</span>
        <div class="h-px flex-1 bg-[#2A2622]"></div>
      </div>

      <button type="button" class="w-full text-sm font-medium border border-[#332E28] rounded-md px-6 py-3 hover:border-[#E3A63C] hover:bg-[#E3A63C]/[0.14] transition-colors flex items-center justify-center gap-2.5">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.8v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.9 14.7 3 12 3 6.9 3 2.8 7.1 2.8 12.2S6.9 21.4 12 21.4c6.9 0 9.2-4.9 9.2-7.4 0-.5 0-.9-.1-1.3H12z"/></svg>
        Continue with Google
      </button>

      <p class="text-[11px] text-[#6E645A] text-center leading-relaxed mt-1">By creating an account you agree to Omnivex's Terms and Privacy Policy.</p>
    </form>

    <p class="text-center text-sm text-[#A89C8C] mt-6">
      Already have an account? <a href="login.html" class="text-[#E3A63C] hover:underline font-medium">Log in</a>
    </p>
  </div>
</main>

<script src="signup.js"></script>

</body>
</html>
